<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Go Find Me — Brand Ratings & Reviews</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="sidebar-backdrop" id="sidebarBackdrop" onclick="toggleMobileSidebar(false)"></div>

    <aside id="sidebar">
        <h2 id="sidebarTitle">Categories</h2>

        <button type="button" class="category-item active" data-category="All">
            <span class="category-left">
                <span class="cat-icon">⚡</span>
                <span class="cat-label" data-cat-name="All">All</span>
            </span>
            <span class="cat-count" id="count-All">0</span>
        </button>

        <button type="button" class="category-item" data-category="Sports">
            <span class="category-left">
                <span class="cat-icon">⚽</span>
                <span class="cat-label" data-cat-name="Sports">Sports</span>
            </span>
            <span class="cat-count" id="count-Sports">0</span>
        </button>

        <button type="button" class="category-item" data-category="Fashion">
            <span class="category-left">
                <span class="cat-icon">👕</span>
                <span class="cat-label" data-cat-name="Fashion">Fashion</span>
            </span>
            <span class="cat-count" id="count-Fashion">0</span>
        </button>

        <button type="button" class="category-item" data-category="Games">
            <span class="category-left">
                <span class="cat-icon">🎮</span>
                <span class="cat-label" data-cat-name="Games">Games</span>
            </span>
            <span class="cat-count" id="count-Games">0</span>
        </button>

        <button type="button" class="category-item" data-category="Everyday Life">
            <span class="category-left">
                <span class="cat-icon">🏠</span>
                <span class="cat-label" data-cat-name="Everyday Life">Everyday Life</span>
            </span>
            <span class="cat-count" id="count-Everyday Life">0</span>
        </button>

        <button type="button" class="category-item" data-category="Books">
            <span class="category-left">
                <span class="cat-icon">📚</span>
                <span class="cat-label" data-cat-name="Books">Books</span>
            </span>
            <span class="cat-count" id="count-Books">0</span>
        </button>

        <button type="button" class="category-item" data-category="Technology">
            <span class="category-left">
                <span class="cat-icon">💻</span>
                <span class="cat-label" data-cat-name="Technology">Technology</span>
            </span>
            <span class="cat-count" id="count-Technology">0</span>
        </button>
    </aside>

    <main>
        <header>
            <div class="brand-header-left">
                <button type="button" class="mobile-menu-btn" aria-label="Menu" onclick="toggleMobileSidebar()">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
                </button>
                <h1 class="logo-title">
                    g<span class="logo-magnifier">
                        <svg viewBox="0 0 24 24">
                            <circle cx="10" cy="14" r="7"/>
                            <line x1="15" y1="9" x2="22" y2="2"/>
                        </svg>
                    </span> find me
                </h1>
            </div>
            <div class="controls">
                <select id="langSelect" class="lang-select" onchange="changeLanguage(this.value)">
                    <option value="en">English</option>
                    <option value="fr">Français</option>
                    <option value="ar">العربية</option>
                    <option value="es">Español</option>
                    <option value="de">Deutsch</option>
                    <option value="it">Italiano</option>
                    <option value="pt">Português</option>
                </select>

                <label class="sort" for="sort">
                    <span id="sortLabel">Sort by:</span>
                    <select id="sort">
                        <option value="verified-desc">Best verified ratings</option>
                        <option value="verified-asc">Worst verified ratings</option>
                        <option value="trending">Trending (Most visits)</option>
                        <option value="niche">Niche (Fewest visits)</option>
                        <option value="new">New (&lt; 1 year)</option>
                        <option value="unverified-desc">Best unverified ratings</option>
                        <option value="unverified-asc">Worst unverified ratings</option>
                        <option value="rating-desc">Best global rating</option>
                        <option value="rating-asc">Worst global rating</option>
                    </select>
                </label>

                <div class="search-wrapper">
                    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                    <input type="search" class="search-bar" id="search" placeholder="Search brands..." autocomplete="off">
                </div>

                <div id="authContainer">
                    <button class="auth-btn" onclick="openModal()">Sign In</button>
                </div>
            </div>
        </header>

        <div class="section-head">
            <h2 id="section-title">All</h2>
            <span class="result-count" id="result-count"></span>
        </div>

        <div class="grid" id="grid"></div>
    </main>

    <div class="profile-fullscreen" id="profilePage">
        <div class="profile-header-nav">
            <button class="back-btn" onclick="closeProfilePage()">← Back to catalog</button>
            <div class="profile-nav-title">
                <span>My Account</span>
                <span class="profile-pill-badge">Profile Menu</span>
            </div>
        </div>
        <div class="profile-content" id="profileContentContainer"></div>
    </div>

    <div class="brand-detail-fullscreen" id="brandDetailPage">
        <div class="brand-banner"></div>
        <div class="brand-detail-container" id="brandDetailContent"></div>
    </div>

    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <button class="close-modal" onclick="closeModal()" aria-label="Close">×</button>
            <div class="modal-top-badge">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
            </div>
            <div class="modal-header-block">
                <h3 id="modalTitle">Create an Account</h3>
                <p class="modal-subtitle" id="modalSubtitle">Join Go Find Me to save favorite brands and leave reviews.</p>
            </div>
            <div class="modal-fields">
                <div class="modal-input-wrap" id="usernameWrap">
                    <svg class="modal-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                    <input type="text" id="usernameInput" placeholder="Username" autocomplete="username">
                </div>
                <div class="modal-input-wrap">
                    <svg class="modal-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                        <polyline points="22,6 12,13 2,6"></polyline>
                    </svg>
                    <input type="email" id="emailInput" placeholder="Email" autocomplete="email">
                </div>
                <div class="modal-input-wrap">
                    <svg class="modal-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                    </svg>
                    <input type="password" id="passwordInput" placeholder="Password" autocomplete="new-password">
                    <button type="button" class="password-toggle-btn" id="passwordToggleBtn" onclick="togglePasswordVisibility()" aria-label="Toggle password visibility" title="Show/Hide password">
                        <svg id="eyeIcon" viewBox="0 0 24 24">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                    </button>
                </div>
            </div>
            <div class="auth-feedback-box" id="authFeedbackBox">
                <div class="form-error" id="authError"></div>
                <div class="form-info" id="authInfo"></div>
                <button type="button" class="resend-btn" id="resendVerificationBtn" onclick="resendVerificationEmail()">↻ Resend verification email</button>
            </div>
            <button class="modal-submit" id="modalSubmit" onclick="handleAuth()">Sign Up</button>
            <div class="modal-footer-divider"></div>
            <span class="modal-toggle" id="modalToggle" onclick="toggleAuthMode()">Already have an account? <strong>Sign In</strong></span>
        </div>
    </div>

    <input type="file" id="avatarUpload" accept="image/*" style="display: none;" onchange="handleAvatarChange(event)">

    <div class="toast" id="toast"></div>

    <script type="module" src="app.js"></script>
</body>
</html>
